<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Fer ♡</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:
        radial-gradient(ellipse at top, #283b60 0%, #111522 48%, #050609 100%);
    font-family:Arial, sans-serif;
    color:white;
    overflow-x:hidden;
}

/* ESTRELLAS */

.estrella{
    position:fixed;
    color:white;
    font-size:22px;
    opacity:.5;
    pointer-events:none;
    animation:brillar 3s infinite ease-in-out;
}

.e1{top:8%;left:10%;}
.e2{top:17%;right:12%;animation-delay:.5s;}
.e3{top:40%;left:6%;animation-delay:1s;}
.e4{bottom:20%;right:8%;animation-delay:1.5s;}
.e5{bottom:10%;left:18%;animation-delay:.8s;}
.e6{top:30%;right:25%;animation-delay:1.2s;}

@keyframes brillar{
    0%,100%{
        opacity:.25;
        transform:scale(.8);
    }
    50%{
        opacity:1;
        transform:scale(1.2);
    }
}

/* CONTENEDOR */

.contenedor{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:35px 12px 50px;
}

.titulo{
    text-align:center;
    font-size:clamp(34px,8vw,58px);
    color:#ff6685;
    text-shadow:
        0 0 10px #ff1744,
        0 0 25px rgba(255,23,68,.6);
    margin-bottom:8px;
}

.subtitulo{
    text-align:center;
    color:#dedee8;
    font-size:15px;
    margin-bottom:15px;
}

/* RAMO */

.ramo{
    position:relative;
    width:min(420px, 96vw);
    height:510px;
    margin:0 auto;
}

/* TALLOS */

.tallo{
    position:absolute;
    width:8px;
    height:275px;
    bottom:65px;
    left:50%;
    transform-origin:bottom;
    border-radius:10px;
    background:linear-gradient(
        to right,
        #174323,
        #64b878,
        #245a31
    );
    z-index:1;
}

.t1{transform:rotate(-32deg);}
.t2{transform:rotate(-16deg);}
.t3{transform:rotate(0deg);}
.t4{transform:rotate(16deg);}
.t5{transform:rotate(32deg);}

/* HOJAS */

.hoja{
    position:absolute;
    width:55px;
    height:25px;
    background:linear-gradient(135deg,#5aa967,#236b39);
    border-radius:100% 0 100% 0;
    z-index:2;
}

.h1{
    left:48px;
    bottom:195px;
    transform:rotate(-25deg);
}

.h2{
    left:88px;
    bottom:145px;
    transform:rotate(25deg);
}

.h3{
    right:48px;
    bottom:190px;
    transform:rotate(30deg);
}

.h4{
    right:85px;
    bottom:140px;
    transform:rotate(-25deg);
}

/* HOT WHEELS */

.carro{
    position:absolute;
    width:48%;
    height:115px;
    object-fit:contain;
    background:transparent;
    border:0;
    padding:0;
    mix-blend-mode:normal;
    filter:drop-shadow(0 7px 5px rgba(0,0,0,.35));
    z-index:5;
    animation:entrada .8s ease both;
    transition:filter .3s ease;
}

.carro:hover{
    filter:
        brightness(1.08)
        drop-shadow(0 0 12px rgba(255,255,255,.45));
}

/* POSICIONES DE LOS CINCO CARROS */

.c1{
    top:0;
    left:26%;
    transform:rotate(-8deg);
    animation-delay:.1s;
}

.c2{
    top:75px;
    left:-1%;
    transform:rotate(-18deg);
    animation-delay:.3s;
}

.c3{
    top:75px;
    right:-1%;
    transform:rotate(18deg);
    animation-delay:.5s;
}

.c4{
    top:165px;
    left:13%;
    transform:rotate(-8deg);
    animation-delay:.7s;
}

.c5{
    top:165px;
    right:8%;
    transform:rotate(15deg);
    animation-delay:.9s;
}

/* ENVOLTURA */

.envoltura{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:170px;
    background:linear-gradient(
        135deg,
        #191919,
        #454545,
        #171717
    );
    clip-path:polygon(
        3% 0,
        97% 0,
        72% 100%,
        28% 100%
    );
    z-index:10;
}

.envoltura::before,
.envoltura::after{
    content:"";
    position:absolute;
    height:180px;
    width:3px;
    top:0;
    left:50%;
    background:rgba(255,255,255,.2);
}

.envoltura::before{
    transform:rotate(12deg);
}

.envoltura::after{
    transform:rotate(-12deg);
}

/* MOÑO */

.mono{
    position:absolute;
    width:110px;
    height:55px;
    bottom:35px;
    left:50%;
    transform:translateX(-50%);
    z-index:15;
}

.lazo{
    position:absolute;
    top:5px;
    width:60px;
    height:42px;
    background:linear-gradient(135deg,#ff5577,#c90036);
    box-shadow:0 0 12px rgba(255,23,68,.3);
}

.izq{
    left:0;
    border-radius:70% 20% 70% 20%;
    transform:rotate(15deg);
}

.der{
    right:0;
    border-radius:20% 70% 20% 70%;
    transform:rotate(-15deg);
}

.centro{
    position:absolute;
    left:41px;
    top:12px;
    width:28px;
    height:28px;
    border-radius:50%;
    background:#ff7891;
    border:3px solid #d91543;
}

/* BOTÓN */

.boton{
    margin-top:5px;
    border:0;
    border-radius:30px;
    padding:15px 28px;
    background:linear-gradient(135deg,#ff5577,#e6003c);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 18px rgba(255,23,68,.45);
    transition:transform .3s;
}

.boton:hover{
    transform:scale(1.06);
}

/* CARTA */

.carta{
    display:none;
    width:min(550px, 92vw);
    margin-top:25px;
    padding:28px 23px;
    text-align:center;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    border-radius:22px;
    box-shadow:0 10px 35px rgba(0,0,0,.25);
    animation:subir .7s ease;
}

.carta h2{
    color:#ff7895;
    font-size:25px;
    margin-bottom:18px;
}

.carta p{
    color:#f5f1f5;
    font-size:16px;
    line-height:1.9;
}

.firma{
    display:block;
    margin-top:15px;
    color:#ff9db1;
    font-size:20px;
}

.pie{
    margin-top:20px;
    font-size:13px;
    color:#aeb3c5;
    text-align:center;
}

/* ANIMACIONES */

@keyframes entrada{
    from{
        opacity:0;
        scale:.3;
    }
    to{
        opacity:1;
        scale:1;
    }
}

@keyframes subir{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* CELULAR */

@media(max-width:380px){
    .ramo{
        height:460px;
    }

    .carro{
        height:100px;
    }

    .c2,.c3{
        top:65px;
    }

    .c4,.c5{
        top:145px;
    }

    .envoltura{
        width:230px;
        height:150px;
    }
}

@media(prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms !important;
        transition-duration:.01ms !important;
    }
}
</style>
</head>

<body>

<!-- ESTRELLAS -->

<div class="estrella e1">✦</div>
<div class="estrella e2">✧</div>
<div class="estrella e3">✦</div>
<div class="estrella e4">✧</div>
<div class="estrella e5">✦</div>
<div class="estrella e6">✧</div>

<div class="contenedor">

    <h1 class="titulo">Para Fer ♡</h1>

    <p class="subtitulo">
        Un ramo un poquito diferente... 🏎️
    </p>

    <!-- RAMO -->

    <div class="ramo">

        <!-- TALLOS -->
        <div class="tallo t1"></div>
        <div class="tallo t2"></div>
        <div class="tallo t3"></div>
        <div class="tallo t4"></div>
        <div class="tallo t5"></div>

        <!-- HOJAS -->
        <div class="hoja h1"></div>
        <div class="hoja h2"></div>
        <div class="hoja h3"></div>
        <div class="hoja h4"></div>

        <!-- CARROS TRANSPARENTES -->

        <img
            src="mclaren_p1_transparent.jpeg"
            class="carro c1"
            alt="McLaren P1">

        <img
            src="porsche_911_gt3_transparent.jpeg"
            class="carro c2"
            alt="Porsche 911 GT3">

        <img
            src="mclaren_720s_transparent.jpeg"
            class="carro c3"
            alt="McLaren 720S">

        <img
            src="toyota_supra_transparent.jpeg"
            class="carro c4"
            alt="Toyota Supra">

        <img
            src="dodge_charger_transparent.jpeg"
            class="carro c5"
            alt="Dodge Charger R/T">

        <!-- ENVOLTURA -->
        <div class="envoltura"></div>

        <!-- MOÑO -->
        <div class="mono">
            <div class="lazo izq"></div>
            <div class="lazo der"></div>
            <div class="centro"></div>
        </div>

    </div>

    <!-- BOTÓN -->

    <button class="boton" onclick="abrirCarta()">
        🏎️ Abrir mi regalo
    </button>

    <!-- CARTA -->

    <div class="carta" id="carta">

        <h2>Para ti, Fer ♡</h2>

        <p>
            No importa la distancia, ni las barreras
            que nos ponga el camino, tu nunca vas
            a ser espectador ♡

            <br><br>

            Espero que te guste este pequeño regalo,
            el próximo año prometo darte uno en persona

            <span class="firma">₍ᐢ..ᐢ₎♡</span>
        </p>

    </div>

    <p class="pie">
        Hecho especialmente para ti ♡
    </p>

</div>

<script>
function abrirCarta(){

    const carta = document.getElementById("carta");

    if(carta.style.display === "block"){
        carta.style.display = "none";
    }else{
        carta.style.display = "block";

        setTimeout(function(){
            carta.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });
        }, 100);
    }
}
</script>

</body>
</html>
