<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Fer 💗</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top,#263b63 0%,#10131c 45%,#050609 100%);
    font-family:Arial,sans-serif;
    color:white;
    overflow-x:hidden;
}

/* ESTRELLAS */

.estrella{
    position:fixed;
    color:white;
    font-size:22px;
    opacity:.7;
    animation:brillar 2.5s infinite ease-in-out;
}

.e1{top:8%;left:10%;}
.e2{top:18%;right:12%;animation-delay:.5s;}
.e3{top:45%;left:5%;animation-delay:1s;}
.e4{bottom:20%;right:8%;animation-delay:1.5s;}
.e5{bottom:10%;left:18%;animation-delay:.8s;}
.e6{top:30%;right:25%;animation-delay:1.2s;}

@keyframes brillar{
    0%,100%{
        opacity:.2;
        transform:scale(.8);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }
}

/* CONTENEDOR */

.contenedor{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:35px 15px;
}

.titulo{
    text-align:center;
    font-size:clamp(30px,8vw,55px);
    color:#ff4d6d;
    text-shadow:
        0 0 8px #ff1744,
        0 0 25px #ff1744;
    margin-bottom:5px;
}

.subtitulo{
    color:#ddd;
    font-size:15px;
    margin-bottom:15px;
}

/* RAMO */

.ramo{
    position:relative;
    width:370px;
    max-width:95vw;
    height:540px;
    margin-top:5px;
}

/* TALLOS */

.tallo{
    position:absolute;
    width:8px;
    height:285px;
    background:linear-gradient(
        to right,
        #174d2b,
        #53a866,
        #174d2b
    );

    bottom:80px;
    left:50%;
    transform-origin:bottom;
    border-radius:10px;
    z-index:1;
}

.t1{
    transform:rotate(-30deg);
}

.t2{
    transform:rotate(-15deg);
}

.t3{
    transform:rotate(0deg);
}

.t4{
    transform:rotate(15deg);
}

.t5{
    transform:rotate(30deg);
}

/* HOJAS */

.hoja{
    position:absolute;
    width:55px;
    height:25px;
    background:#31864c;
    border-radius:100% 0 100% 0;
    z-index:2;
}

.h1{
    bottom:205px;
    left:67px;
    transform:rotate(-30deg);
}

.h2{
    bottom:160px;
    left:95px;
    transform:rotate(25deg);
}

.h3{
    bottom:190px;
    right:65px;
    transform:rotate(30deg);
}

.h4{
    bottom:145px;
    right:90px;
    transform:rotate(-25deg);
}

/* CARROS */

.carro{
    position:absolute;
    width:175px;
    height:105px;

    object-fit:contain;
    object-position:center;

    background:white;

    border-radius:12px;

    padding:4px;

    filter:
        drop-shadow(0 7px 8px rgba(0,0,0,.65));

    z-index:5;

    transition:
        transform .35s ease,
        filter .35s ease;

    animation:aparecer .8s ease backwards;
}
    z-index:5;

    transition:
        transform .35s ease,
        filter .35s ease;

    animation:aparecer .8s ease backwards;
}

.carro:hover{
    filter:
        drop-shadow(0 0 15px rgba(255,255,255,.8));

    z-index:20;
}

/* POSICIONES */

.c1{
    top:15px;
    left:100px;
    transform:rotate(-12deg);
    animation-delay:.1s;
}

.c2{
    top:80px;
    left:10px;
    transform:rotate(-25deg);
    animation-delay:.3s;
}

.c3{
    top:80px;
    right:5px;
    transform:rotate(22deg);
    animation-delay:.5s;
}

.c4{
    top:150px;
    left:100px;
    transform:rotate(4deg);
    animation-delay:.7s;
}

.c5{
    top:160px;
    right:15px;
    transform:rotate(30deg);
    animation-delay:.9s;
}

/* ENVOLTURA */

.envoltura{
    position:absolute;
    bottom:0;
    left:50%;
    transform:translateX(-50%);

    width:260px;
    height:190px;

    background:
        linear-gradient(
            135deg,
            #1b1b1b,
            #444,
            #151515
        );

    clip-path:polygon(
        5% 0,
        95% 0,
        72% 100%,
        28% 100%
    );

    z-index:10;

    box-shadow:
        0 10px 25px rgba(0,0,0,.6);
}

/* LINEAS DE LA ENVOLTURA */

.envoltura::before{
    content:"";
    position:absolute;
    width:3px;
    height:190px;
    background:#777;
    left:50%;
    transform:rotate(10deg);
    opacity:.4;
}

.envoltura::after{
    content:"";
    position:absolute;
    width:3px;
    height:190px;
    background:#777;
    left:50%;
    transform:rotate(-10deg);
    opacity:.4;
}

/* MOÑO */

.mono{
    position:absolute;
    bottom:42px;
    left:50%;
    transform:translateX(-50%);
    width:105px;
    height:55px;
    z-index:15;
}

.mono .izq,
.mono .der{
    position:absolute;
    width:60px;
    height:45px;
    background:#e91e45;
    box-shadow:0 0 10px rgba(255,0,60,.5);
}

.mono .izq{
    left:0;
    border-radius:70% 20% 70% 20%;
    transform:rotate(15deg);
}

.mono .der{
    right:0;
    border-radius:20% 70% 20% 70%;
    transform:rotate(-15deg);
}

.mono .centro{
    position:absolute;
    width:28px;
    height:28px;
    background:#ff355c;
    border-radius:50%;
    left:38px;
    top:8px;
}

/* BOTON */

.boton{
    margin-top:-5px;

    border:none;
    border-radius:30px;

    padding:15px 30px;

    background:#ff1744;
    color:white;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 0 10px #ff1744,
        0 0 25px rgba(255,23,68,.5);

    transition:.3s;
}

.boton:hover{
    transform:scale(1.08);
}

/* CARTA */

.carta{
    display:none;

    width:90%;
    max-width:550px;

    margin-top:25px;

    padding:28px;

    background:rgba(255,255,255,.09);

    border:1px solid rgba(255,255,255,.2);

    border-radius:22px;

    backdrop-filter:blur(10px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.4);

    text-align:center;

    animation:subir .7s ease;
}

.carta h2{
    color:#ff5577;
    margin-bottom:15px;
}

.carta p{
    line-height:1.7;
    color:#eee;
    font-size:16px;
}

@keyframes aparecer{

    from{
        opacity:0;
        transform:scale(.3);
    }

    to{
        opacity:1;
    }
}

@keyframes subir{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* CELULAR */

@media(max-width:500px){

    .ramo{
        height:500px;
        transform:scale(.9);
        margin-top:-10px;
        margin-bottom:-20px;
    }

    .carro{
        width:155px;
        height:95px;
    }

    .titulo{
        margin-top:10px;
    }

}

</style>
</head>

<body>

<!-- ESTRELLAS -->

<div class="estrella e1">✦</div>
<div class="estrella e2">✧</div>
<div class="estrella e3">✦</div>
<div class="estrella e4">✧</div>
<div class="estrella e5">✦</div>
<div class="estrella e6">✧</div>


<div class="contenedor">

    <h1 class="titulo">
        Para Fer ❤️
    </h1>

    <p class="subtitulo">
        Un ramo un poquito diferente... 🏎️
    </p>


    <!-- RAMO -->

    <div class="ramo">

        <!-- TALLOS -->

        <div class="tallo t1"></div>
        <div class="tallo t2"></div>
        <div class="tallo t3"></div>
        <div class="tallo t4"></div>
        <div class="tallo t5"></div>


        <!-- HOJAS -->

        <div class="hoja h1"></div>
        <div class="hoja h2"></div>
        <div class="hoja h3"></div>
        <div class="hoja h4"></div>


        <!-- HOT WHEELS -->

        <img
            src="McLarenP1.jpeg"
            class="carro c1"
            alt="McLaren P1.jpeg">

        <img
            src="Porsche 911 GT3.jpeg"
            class="carro c2"
            alt="Porsche 911 GT3">

        <img
            src="McLaren720S.jpeg"
            class="carro c3"
            alt="McLaren 720S">

        <img
            src="Toyota Supra.jpeg"
            class="carro c4"
            alt="Toyota Supra">

        <img
            src="Dodge Charger RT.jpeg"
            class="carro c5"
            alt="Dodge Charger RT">


        <!-- ENVOLTURA -->

        <div class="envoltura"></div>


        <!-- MOÑO -->

        <div class="mono">

            <div class="izq"></div>
            <div class="der"></div>
            <div class="centro"></div>

        </div>

    </div>


    <!-- BOTÓN -->

    <button
        class="boton"
        onclick="abrirCarta()">

        🏎️ Abrir mi regalo

    </button>


    <!-- CARTA -->

    <div
        class="carta"
        id="carta">

        <h2>
            Para ti, Fer 💗
        </h2>

        <p>
    No importa la distancia, ni las barreras que nos ponga el camino, tu nunca vas a ser espectador ♡
        <br><br>
        Espero que te guste este pequeño regalo, el próximo año prometo darte uno en persona  ₍ᐢ..ᐢ₎♡
        </p>

    </div>

</div>


<script>

function abrirCarta(){

    const carta = document.getElementById("carta");

    if(carta.style.display === "block"){

        carta.style.display = "none";

    }else{

        carta.style.display = "block";

        carta.scrollIntoView({
            behavior:"smooth"
        });

    }

}

</script>

</body>
</html>
